# transom — one Worker, two hostnames.
#   transom.levelbrook.com         the voice line's webhooks + the dashboard + JSON API
#   plumbline-edge.levelbrook.com  the same Worker acting as an edge layer in front of a Next.js app on Vercel
name = "transom"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "transom.levelbrook.com/*",         zone_id = "a7ef509c1a53145bb893e633e69be9a0" },
  { pattern = "plumbline-edge.levelbrook.com/*",  zone_id = "a7ef509c1a53145bb893e633e69be9a0" },
]

[vars]
SITE_HOST     = "transom.levelbrook.com"
EDGE_HOST     = "plumbline-edge.levelbrook.com"
ORIGIN        = "https://plumbline.levelbrook.com"
TWILIO_NUMBER = "+12069844716"

# Call log + edge request log + the maintenance flag. Created with `wrangler kv namespace create LOG`.
[[kv_namespaces]]
binding = "LOG"
id = "394cfebfbe58422d9d2cbbf3d1f8ec7e"

# Per-client-IP rate limit on the edge hostname (Workers Rate Limiting binding).
[[ratelimits]]
name = "EDGE_RL"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true

# Secrets (wrangler secret put): TWILIO_AUTH_TOKEN, FORWARD_TO, ADMIN_TOKEN
